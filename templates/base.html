<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes App | {% block Title %}{% endblock Title %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-neutral-50 text-neutral-900">

    <div class="min-h-screen flex">

        <!-- Sidebar -->
        <aside class="hidden md:flex w-64 flex-col border-r border-neutral-200 bg-white">

            <!-- Logo -->
            <div class="h-16 px-6 flex items-center border-b border-neutral-200">
                <a href="{{url_for('main_list')}}">
                    <div class="flex items-center gap-2">

                        <div class="w-7 h-7 rounded-md text-white
                                    flex items-center justify-center
                                    text-sm font-semibold">
                            📝
                        </div>

                        <span class="font-semibold tracking-tight">
                            Notes
                        </span>

                    </div>
                </a>
            </div>


            <!-- Navigation -->
            <nav class="p-3">

                <a href="#"
                   class="flex items-center gap-3 px-3 py-2
                          rounded-md bg-neutral-100
                          text-sm font-medium">

                    <!-- Notes icon -->
                    <svg
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"/>

                    </svg>

                    All notes

                </a>


                <a href="#"
                   class="mt-1 flex items-center gap-3 px-3 py-2
                          rounded-md text-sm text-neutral-500
                          hover:bg-neutral-100 hover:text-neutral-900">

                    <!-- Star icon -->
                    <svg
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 3l2.9 5.88
                               6.49.94-4.7 4.58
                               1.11 6.47L12 18.77
                               6.2 21.87l1.11-6.47
                               -4.7-4.58 6.49-.94L12 3z"/>

                    </svg>

                    Favorites

                </a>

            </nav>


            <!-- Notes list -->
            <div class="px-3 mt-5">

                <div class="px-3 mb-2 text-xs font-medium
                            uppercase tracking-wide
                            text-neutral-400">

                    Notes

                </div>


                <div class="space-y-1">

                   


           

                    <!-- Note -->
                     {% for note in notes %}
                    <a href="{{url_for('view_note', id=note.id)}}" class="block px-3 py-2 rounded-md hover:bg-neutral-100">
                        <div class="text-sm font-medium truncate">
                            {{note.title}}
                        </div>

                        <div class="mt-1 text-xs text-neutral-400">
                            {{note.updated_at}}
                        </div>
                    </a>
                     {% endfor %}


                 

                </div>

            </div>

        </aside>


        <!-- Main content -->
        <main class="flex-1 min-w-0">

        <!-- Header -->
         {% block Header %}{% endblock Header %}

        <!-- Content -->
        {% block Content %}{% endblock Content %}
        </main>

    </div>

</body>
</html>
