{% extends "base.html" %}
{% block Title %}{{note.title}} |{% endblock Title %}

<!-- Header -->
{% block Header %}
<header class="h-16 px-6 border-b border-neutral-200 bg-white flex items-center justify-between">
    <div class="flex items-center gap-3">

        <!-- Mobile menu -->
        <button
            class="md:hidden text-neutral-500">
            ☰
        </button>

        <h1 class="text-sm font-medium">
            All notes
        </h1>

    </div>


    <!-- Edit note -->
    <a href="{{url_for('edit_note', id=note.id)}}" class="px-3 py-2 text-sm text-neutral-500 hover:bg-neutral-100 rounded-md">
        <span class="text-base leading-none">
            ✏️
        </span>
        Edit note
    </a>

</header>
{% endblock Header %}


<!-- CONTENT -->
{% block Content %}
<!-- VIEWER/EDITOR -->
<section class="max-w-3xl mx-auto px-6 py-12">

    <!-- Metadata -->
    <div class="flex items-center gap-3 mb-8">

        <span class="text-xs text-neutral-400">
            Updated {{note.updated_at}}
        </span>

        <span class="w-1 h-1 rounded-full bg-neutral-300"></span>

        <span class="text-xs text-neutral-400">
            {{note.content| length}} characters
        </span>

    </div>

   <!-- TITLE -->
    <h1
    class="w-full text-4xl font-bold tracking-tight bg-transparent border-none outline-none placeholder:text-neutral-300 mb-6"
    >
        {{note.title}}
    </h1>
    <p
    class="w-full min-h-[500px] resize-none bg-transparent border-none outline-none text-lg leading-8 text-neutral-700 placeholder:text-neutral-300"
    >{{note.content}}
    </p>
</section>
{% endblock Content %}
