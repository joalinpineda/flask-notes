{% extends "base.html" %}
{% block Title %}Add note{% endblock Title %}

{% block Header %}
<header class="h-16 px-6 border-b border-neutral-200 bg-white flex items-center justify-between">
    <div class="flex items-center gap-3">
        <!-- Mobile menu -->
        <button class="md:hidden text-neutral-500">
            ☰
        </button>

        <span class="text-sm text-neutral-500">
            All notes
        </span>

        <span class="text-neutral-300">
            /
        </span>

        <span class="text-sm font-medium">
            Add new note
        </span>
    </div>


    <div class="flex items-center gap-2">
        <button type="submit" form="note-form" class="px-3 py-2 text-sm text-neutral-500 hover:bg-sky-100 rounded-md">
           <span class="text-base leading-none">
            💾
            </span>
            Save
        </button>

        <button class="px-3 py-2 text-sm text-amber-500 hover:bg-yellow-100 rounded-md">
            <a href="{{url_for('notes.main_list')}}">
                <span class="text-base leading-none">
                👎
                </span>
                Discard
            </a>
        </button>
    </div>

</header>
{% endblock Header %}


<!-- CONTENT -->
{% block Content %}
<!-- VIEWER/EDITOR -->
<section class="max-w-3xl mx-auto px-6 py-12">
    <form method='POST' id="note-form">
        <!-- TITLE -->
        <input
            type="text"
            value=""
            title="title"
            name="title"
            id="title"
            required
            placeholder="What's on your mind?"
            class="w-full text-4xl font-bold tracking-tight bg-transparent border-none outline-none placeholder:text-neutral-300 mb-6"
        >
        <!-- CONTENT -->
        <textarea
            placeholder="Start writing..."
            title="content"
            id="content"
            name="content"
            class="w-full min-h-[500px] resize-none bg-transparent border-none outline-none text-lg leading-8 text-neutral-700 placeholder:text-neutral-300"
        ></textarea>
    </form>
</section>
{% endblock Content %}
